<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - E-Commerce</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="index.html">E-Commerce</a>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="favorites.html">Favorites</a>
            <a href="contact.html" class="active">Contact</a>
            <button id="theme-toggle" class="theme-toggle-btn" type="button">Dark</button>
            <a href="cart.html" class="cart-icon">
                🛒 <span id="cart-count">0</span>
            </a>
            <span id="user-name" class="user-name"></span>
            <a href="#" id="auth-link">Login</a>
            <a href="#" id="logout-btn" class="logout-btn" style="display: none;">Logout</a>
        </div>
    </nav>

    <section class="contact-section standalone-favorites" id="contact">
        <div class="contact-header">
            <h2>Contact Us</h2>
            <p>Have a question or suggestion? Send us a message and we will get back to you.</p>
        </div>

        <div class="contact-grid">
            <div class="contact-info-card">
                <h3>Support</h3>
                <p>Email: support@eshop.com</p>
                <p>Phone: +20 100 000 0000</p>
                <p>Hours: Sun - Thu, 9:00 AM - 6:00 PM</p>
            </div>

            <form id="contact-form" class="contact-form">
                <input type="text" id="contact-name" placeholder="Your Name" required>
                <p id="contact-name-error" class="contact-field-error"></p>
                <input type="email" id="contact-email" placeholder="Your Email" required>
                <p id="contact-email-error" class="contact-field-error"></p>
                <input type="text" id="contact-subject" placeholder="Subject" required>
                <p id="contact-subject-error" class="contact-field-error"></p>
                <textarea id="contact-message" placeholder="Write your message..." required></textarea>
                <p id="contact-message-error" class="contact-field-error"></p>
                <button type="submit" class="contact-submit-btn">Send Message</button>
                <p id="contact-status" class="contact-status"></p>
            </form>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 E-Commerce Store. All Rights Reserved.</p>
        <button class="scroll-top" id="scroll-top">⬆</button>
    </footer>

    <script src="js/theme.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
